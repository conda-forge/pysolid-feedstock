{% set name = "pysolid" %}
{% set version = "0.3.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 01376cd3bd1fa1fa70919466ec25ae8159c5b1d5d02017462df51a5e114b1b8c
  patches:
    # normalize the f2py include path on Windows, see https://github.com/conda-forge/pysolid-feedstock/issues/20
    - windows-path.patch

build:
  number: 4
  skip: true  # [py<36]
  script_env:
    - SKBUILD_CMAKE_ARGS="-GNinja"  # [unix]
  script:
    # conda-build presets CMAKE_GENERATOR to Visual Studio, which cannot drive gfortran
    - set "CMAKE_GENERATOR=Ninja"  # [win]
    - {{ PYTHON }} -m pip install . -vv  # [build_platform == target_platform]
    # FindPython fails to find free-threaded Python when cross-compiling (CMake 4.4.5, Python 3.14.10);
    # let it query the interpreter instead, cf. https://github.com/conda-forge/conda-forge.github.io/issues/2901
    - {{ PYTHON }} -m pip install . -vv -Ccmake.define.CMAKE_POLICY_DEFAULT_CMP0190=NEW -Ccmake.define.CMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/env  # [build_platform != target_platform]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - cmake
    - ninja
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - {{ compiler("fortran") }}

  host:
    - python
    - pip
    - scikit-build-core
    - numpy
    - setuptools
    - setuptools_scm
  run:
    - python
    - numpy
    - scipy

test:
  imports:
    - pysolid
    - pysolid.solid

about:
  home: https://github.com/insarlab/PySolid
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: A Python wrapper for solid to compute solid Earth tides
  description: |
    The Python-based solid Earth tides (PySolid) is a thin Python wrapper of the
    `solid.for` program (by Dennis Milbert based on `dehanttideinelMJD.f` from
    V. Dehant, S. Mathews, J. Gipson and C. Bruyninx) to calculate solid Earth
    tides in the east/north/up direction (section 7.1.1 in the 2010 IERS Conventions).
    Solid Earth tides introduce large offsets in SAR observations and long spatial
    wavelength ramps in InSAR observations, as shown in the Sentinel-1 data with
    regular acquisitions and large swaths (Yunjun et al., 2022).
  dev_url: https://github.com/insarlab/PySolid

extra:
  recipe-maintainers:
    - jhkennedy
    - jlrine2
    - scottstanie
    - yunjunz
